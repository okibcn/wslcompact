# Description: Prepares package and releases it.

name: Release
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled true/false (default: false)'
        required: false
        default: 'false'
      release:
        description: 'Type (yes) for release, (no) will generate an artifact (default: no)'
        required: false
        default: 'no'

jobs:
  smoke:
    runs-on: windows-latest
    steps:
    - name: "⏬ Checkout repository"
      uses: actions/checkout@v7

    - name: "Module import + help smoke test"
      shell: pwsh
      run: |
        Set-ExecutionPolicy -Scope Process Bypass -Force
        Import-Module ./WslCompact/WslCompact.psm1
        $out = WslCompact -h *>&1 | Out-String
        if ($out -notmatch 'Usage:') { throw "help output missing" }

  build:
    needs: smoke
    runs-on: ubuntu-latest
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: "⏬ Checkout repository"
      uses: actions/checkout@v7

    - name: "🐞 Debug session"
      uses: mxschmitt/action-tmate@v3
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true'
        ## More info at https://til.simonwillison.net/github-actions/debug-tmate
        ##           or https://github.com/mxschmitt/action-tmate

    - name: "📦 Create Package"
      run: |
        ############################
        ##                          ##
        ##      CREATE PACKAGE      ##
        ##                          ##
        ############################

        cp LICENSE README* -t WslCompact
        VERSION=$(grep -Po "(?<=^ModuleVersion = ')[^']+" WslCompact/WslCompact.psd1)
        zip "./WslCompact-v$VERSION.zip" WslCompact/*
        sha256sum "./WslCompact-v$VERSION.zip" > "./WslCompact-v$VERSION.zip.sha256"
        echo "VERSION=${VERSION}" >>$GITHUB_ENV

    - name: "👍 Upload Artifact"
      uses: actions/upload-artifact@v7
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.release != 'yes'
      with:
        name: ${{ env.VERSION }}
        path: |
          *.zip
          *.zip.sha256

    - name: "🎉 Publish a new release"
      uses: softprops/action-gh-release@v3
      # go to https://github.com/OWNER/REPO/settings/actions and
      # in "**"Workflow Permissions" section give actions **Read and Write permissions**.
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.release == 'yes'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        files: |
          ./*.zip
          ./*.zip.sha256
#         body: |
#           ${{ env.BODY }}

